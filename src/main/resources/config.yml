config_version: 3

# Controls how many particles per block are shown for a selection/while generating.
particles_per_block: 5

# How often the selection box particle effect updates, in ticks.
selection_box_update_ticks: 3

# Delay in ticks between each WorldEdit build batch.
build_delay: 0

# Maximum number of cuboid operations applied in one WorldEdit batch.
worldedit_batch_size: 4096

# How often the action bar progress text updates, in ticks.
actionbar_update_ticks: 10

# Timeout in seconds for outbound AI API requests.
request_timeout_seconds: 900

# Maximum number of characters written into chat or logs when large payloads or responses are echoed.
log_excerpt_max_length: 1800

# Sends the formatted answer from the AI to chat.
sendresponse: false

# Sends the payload provided to the endpoint back to the player.
sendpayload: false

# Build generation architecture:
# semantic plan -> Build Program DSL v2 -> Java compiler -> preview critique/refinement -> Java sparse compression

# Quality workflow profile for the compiled pipeline.
#   fast            - direct authoring only unless warning/visual repair flags force one refinement pass
#   balanced        - semantic planning plus one critique/refinement pass
#   maximum_quality - semantic planning plus up to two critique/refinement passes and extended previews
workflow_profile: maximum_quality

workflow_profiles:
  fast:
    planning_enabled: false
    critique_enabled: false
    max_refinement_passes: 0
    extended_previews: false
  balanced:
    planning_enabled: true
    critique_enabled: true
    max_refinement_passes: 1
    extended_previews: false
  maximum_quality:
    planning_enabled: true
    critique_enabled: true
    max_refinement_passes: 2
    extended_previews: true

max_dsl_components: 8
# Counts expanded placements after compact repeated-instance expansion.
max_dsl_instances: 4096
max_dsl_operations: 8000
max_dsl_operations_per_component: 64

max_matrix_blocks_per_generation: 120000
max_total_actions_per_generation: 120000
max_sparse_segments_per_generation: 8000

# Maximum attempts for the initial generation stage.
# Retries cover both transient API failures and repairable invalid model outputs such as out-of-bounds coordinates.
max_generation_attempts: 2
max_repair_attempts: 1

visual_review_enabled: true
visual_review_min_occupied_blocks: 250
visual_review_preview_size: 512

# If the first compiled result is valid but the repair request fails, allow that first valid result to be applied.
apply_best_effort_result: true

# When enabled, generated coordinates outside the current WorldEdit selection are ignored instead of failing compilation.
# Blocks outside the selection are dropped and never placed.
ignore_out_of_bounds_placements: false

# Request a repair pass for already-valid builds when validator warnings indicate poor structure or detail.
# This does not require preview rendering unless visual_review_repair_enabled is also true.
repair_warnings_enabled: true

# Only request a repair pass for already-valid builds based on rendered preview review.
visual_review_repair_enabled: false

# When enabled, generated preview images are also copied into the debug directory.
debug_artifacts_enabled: true
debug_artifact_directory: plugins/CraftGPT/debug

# Default compiled authoring prompt for Build Program DSL v2.
# The planning and critique stages are injected by Java and do not need to be described here.
# Variables:
#   %WIDTH% %HEIGHT% %DEPTH%
#   %WIDTH_MINUS_ONE% %HEIGHT_MINUS_ONE% %DEPTH_MINUS_ONE%
#   %FOOTPRINT% %VOLUME%
#   %MAX_OCCUPIED_BLOCKS%
#   %MAX_DSL_COMPONENTS% %MAX_DSL_INSTANCES% %MAX_DSL_OPERATIONS% %MAX_OPERATIONS_PER_COMPONENT%
#   %MINECRAFT_VERSION%
#   %FRONT_DIRECTION%
#   %X1% %Y1% %Z1% %X2% %Y2% %Z2%
#   %SomeOtherVar%
compiled_prompt: |
  You author a complete Minecraft build, not a sketch or foundation. Return only one MINIFIED Build Program DSL v2 JSON object, without indentation or newlines.
  Selection is %WIDTH% wide, %HEIGHT% high, %DEPTH% deep. X=0..%WIDTH_MINUS_ONE%, Y=0..%HEIGHT_MINUS_ONE%, Z=0..%DEPTH_MINUS_ONE%. Y is vertical. Front is %FRONT_DIRECTION%.
  Always use {"v":2,"o":[0,0,0],"p":[{"i":"1","b":"minecraft:stone_bricks"}],"c":[],"i":[],"a":[]} as the top-level format, populating p,c,i,a as needed. The origin o is always exactly [0,0,0].
  Palette identifiers are one character 1-9 or A-Z. Every add operation references a palette i. Use real Java 1.21.11 block IDs/states only. Use a coherent material palette with main structure, trim, roofing, timber, glazing and lighting as appropriate.
  Supported operation forms (all shown fields required):
  box add: {"k":"box","m":"add","i":"1","f":[x,y,z],"t":[x,y,z],"ho":false,"wt":1}
  box cut: {"k":"box","m":"cut","f":[x,y,z],"t":[x,y,z],"ho":false,"wt":1}
  cylinder: {"k":"cyl","m":"add","i":"1","c":[x,y,z],"r":3,"h":10,"ax":"y","ho":false,"wt":1}
  ellipsoid: {"k":"ell","m":"add","i":"1","c":[x,y,z],"rx":3,"ry":2,"rz":3,"ho":false,"wt":1}
  line: {"k":"line","m":"add","i":"1","f":[x,y,z],"t":[x,y,z],"w":0}
  point add: {"k":"pt","m":"add","i":"1","at":[x,y,z]}
  point cut: {"k":"pt","m":"cut","at":[x,y,z]}
  points add: {"k":"pts","m":"add","i":"1","ps":[[x,y,z],[x,y,z]]}
  points cut: {"k":"pts","m":"cut","ps":[[x,y,z],[x,y,z]]}
  seg: {"k":"seg","m":"add","i":"1","f":[x,y,z],"t":[x,y,z]}
  Coordinates and box endpoints are inclusive. For boxes f must be <= t on every axis. A vertical cylinder's c is its horizontal center and bottom Y; it occupies c.y..c.y+h-1 and c.x/z plus or minus radius.
  Components c are reusable local geometry: {"n":"tower","a":[operations]}. Define at most 8 components with UNIQUE names, each at most 64 operations. Never repeat a component name or duplicate its definition for a new location. Instances i place them: {"c":"tower","at":[x,y,z],"r":0,"mx":false,"mz":false}. Allowed r is 0,90,180,270. Mirror/rotation happens about component origin BEFORE translation. Safest reuse uses r=0,mx=false,mz=false and translation only. Place one instance at each required location; at most 128 instance definitions and 256 top-level operations.
  Repeated instance adds s:[dx,dy,dz],n:count; grid also adds s2:[dx,dy,dz],n2:count. Counts include the first placement. Final transformed extents must remain in bounds.
  Create the main silhouette completely BEFORE decoration. Order: thin foundations, complete hollow walls and floors, structural supports, all towers/major components, complete roofs, entrances and windows, then trim and small details. Cuts affect previously placed blocks: cut openings AFTER the wall they pierce. Never fill an intended courtyard or room with a giant solid box.
  For castles: use four distinct corner towers connected by four thinner curtain walls, a clear open courtyard, an accessible gatehouse/entrance, battlements, and finished tower tops or roofs. Keep a foundation 1-2 blocks thick unless a raised plinth is explicitly requested. Walls must not become a ten-block-thick solid foundation cube. Place towers using the same component at four explicit corner coordinates. Tower roofs should be layered narrowing cylinders or boxes; each roof must end with a visible cap. Keep every roof and overhang in bounds. A castle without its requested tower count, gate and finished tops is incomplete.
  For houses: use thin walls around a hollow interior, a usable entrance and windows, a complete pitched roof built as narrowing box layers, roof overhangs and framing. Do not substitute thick solid masses for rooms.
  Use substantial but coherent detail: regular framed windows, deliberate trim, supports, parapets, roof layers and entrance steps. Do not add random palette speckles or disconnected decorative blocks.
  Budget: at most %MAX_OCCUPIED_BLOCKS% occupied blocks; at most %MAX_DSL_COMPONENTS% components; at most %MAX_DSL_INSTANCES% expanded instances; at most %MAX_DSL_OPERATIONS% operations. Prefer reusable complete components over dumping hundreds of unrelated coordinates. Return complete geometry for every required feature, not an unfinished result. Verify origin, palette references, coordinate bounds, repeated counts and roof completion before finalizing.
  Example of FOUR towers with ONE reusable tower definition, fitting 50 wide x 30 deep with ample height. This is a structural scaffold: finish it with an entrance, windows, parapets and decorative features, and adapt dimensions to the actual selection:
  {"v":2,"o":[0,0,0],"p":[{"i":"1","b":"minecraft:stone_bricks"},{"i":"2","b":"minecraft:spruce_planks"}],"c":[{"n":"tower","a":[{"k":"cyl","m":"add","i":"1","c":[4,0,4],"r":3,"h":15,"ax":"y","ho":true,"wt":1},{"k":"cyl","m":"add","i":"2","c":[4,15,4],"r":4,"h":1,"ax":"y","ho":false,"wt":1},{"k":"cyl","m":"add","i":"2","c":[4,16,4],"r":3,"h":2,"ax":"y","ho":false,"wt":1},{"k":"cyl","m":"add","i":"2","c":[4,18,4],"r":2,"h":2,"ax":"y","ho":false,"wt":1},{"k":"cyl","m":"add","i":"2","c":[4,20,4],"r":1,"h":2,"ax":"y","ho":false,"wt":1}]}],"i":[{"c":"tower","at":[2,0,2],"r":0,"mx":false,"mz":false},{"c":"tower","at":[39,0,2],"r":0,"mx":false,"mz":false},{"c":"tower","at":[2,0,19],"r":0,"mx":false,"mz":false},{"c":"tower","at":[39,0,19],"r":0,"mx":false,"mz":false}],"a":[{"k":"box","m":"add","i":"1","f":[6,0,5],"t":[43,9,6],"ho":false,"wt":1},{"k":"box","m":"add","i":"1","f":[6,0,23],"t":[43,9,24],"ho":false,"wt":1},{"k":"box","m":"add","i":"1","f":[5,0,6],"t":[6,9,23],"ho":false,"wt":1},{"k":"box","m":"add","i":"1","f":[43,0,6],"t":[44,9,23],"ho":false,"wt":1},{"k":"box","m":"cut","f":[23,0,5],"t":[26,5,6],"ho":false,"wt":1}]}
# Preset aliases must not contain dots: Bukkit treats dots as path separators.
# The model IDs inside each payload may still contain dots.
models:
  codex:
    endpoint: http://127.0.0.1:8766/v1/responses
    api_key: codex-local
    payload:
    - model: gpt-6.1-sol
    - reasoning:
        effort: high
    - instructions: runtime-injected
    - input: runtime-injected
  # Codex account models: select the alias in /craftgpt generate <alias> <description>.
  # codex keeps GPT-6.1 Sol/high as the comparison baseline.
  codex-astra:
    endpoint: http://127.0.0.1:8766/v1/responses
    api_key: codex-local
    payload:
    - model: gpt-6-astra
    - reasoning:
        effort: high
    - instructions: runtime-injected
    - input: runtime-injected
